name: Cold email sequence

on:
  # Re-enabled 2026-09-12 after Hostinger reactivated the mailbox, then
  # bumped to hourly the same day once the hardened (1-email-per-run,
  # business-hours-gated) version was confirmed working.
  # send_sequence.py sends at most ONE email per invocation, with subject/
  # body variants; firing at the top of every hour from 13:00-22:00 UTC
  # (matching its own BUSINESS_HOURS_UTC gate) gives ~10 emails/day max,
  # spread across the whole workday instead of a burst.
  schedule:
    - cron: "0 13-22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-sequence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check replies, unsubscribes, bounces
        env:
          IMAP_HOST: imap.hostinger.com
          IMAP_PORT: "993"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python check_replies.py

      - name: Send due sequence emails
        env:
          SMTP_HOST: smtp.hostinger.com
          SMTP_PORT: "465"
          IMAP_HOST: imap.hostinger.com
          IMAP_PORT: "993"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_NAME: "Jefferson"
        run: python send_sequence.py

      - name: Commit updated lead state
        run: |
          git config user.name "palmdesk-cold-email-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/leads.json
          git diff --cached --quiet || git commit -m "Update lead sequence state [skip ci]"
          git push
